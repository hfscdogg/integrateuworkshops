name: Permit Miner

on:
  workflow_dispatch: {}   # the "Run workflow" button in the Actions tab

  # Want it to arrive by itself every Monday morning? Delete the six
  # "#" characters below (not the words), then commit. 12:00 UTC is
  # 8 AM Eastern in summer, 7 AM in winter.
  # schedule:
  #   - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  miner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: session-02-permit-miner

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mine your permits and send your call list
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python permits.py
