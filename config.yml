# =====================================================================
#  SESSION 02 -- THE ONLY FILE YOU NEED TO EDIT.
#
#  Everything about your postcard run lives here: where the permits
#  come from, who you are, what you sell, and which logo goes on the
#  card. Edit it right in the browser, then use the Source Control /
#  Commit button in the left sidebar to save.
#
#  Keep the quotes, the dashes and the indents exactly as they are.
# =====================================================================


# =====================================================================
#  1. YOUR COMPANY  --  this is what gets printed on the postcard.
# =====================================================================
company:
  name: "Livewire"
  tagline: "Smart homes, done right."
  phone: "(555) 555-0100"
  website: "yourcompany.com"

  # The city/region you want printed under your name.
  location: "Richmond, Virginia"


# =====================================================================
#  2. WHAT YOU SELL  --  Claude uses this to score every permit.
#
#  Be specific. "Lighting" scores worse than "tunable white lighting
#  and motorized shades". The more concrete this list is, the better
#  the match, because Claude is comparing these words against what the
#  permit actually says is being built.
# =====================================================================
services:
  - "Whole-home audio and video distribution"
  - "Home theater and media room design"
  - "Lighting control and motorized shades"
  - "Structured wiring and enterprise-grade home networking"
  - "Security cameras and access control"
  - "Outdoor audio and landscape lighting"


# =====================================================================
#  3. YOUR LOGO
#
#  A placeholder logo ships with this repo so your first run works
#  before you upload anything.
#
#  To use your own: in the GitHub web editor, right-click the "brand"
#  folder in the left sidebar, choose Upload..., and pick your file.
#  Then change the name below to match your file exactly.
#
#  PNG with a transparent background looks best. Big is fine, it gets
#  scaled down. If the file is missing, the run still finishes and
#  prints your company name instead.
# =====================================================================
logo_path: "brand/logo.jpeg"


# =====================================================================
#  4. WHERE THE PERMITS COME FROM
#
#  Building permits are public. Most large US counties and cities
#  publish them on a free open-data portal, and they nearly all run the
#  same software, so this miner can read any of them from two values.
#
#  Pointed at Norfolk, VA: the closest locality to Richmond with a
#  live open-data permits feed (Chesterfield keeps permits locked in
#  its ELM portal with no API). Verified current with roughly 1,000
#  permits issued per 30 days.
# =====================================================================
permit_source:
  place: "Austin, Texas"
  portal: "data.austintexas.gov"
  dataset: "3syk-w9eu"

# How many days back to look. Portals publish a few days late, so 30 is
# a safe starting point. Widen it if your area is quiet.
lookback_days: 30

# How many permits to hand to Claude for scoring. Norfolk's eligible
# rate is about 3 percent, so a 25-permit sample usually comes up
# empty. 150 reliably yields around 5 postcard-worthy hits and still
# costs pennies per run.
max_permits: 25


# =====================================================================
#  5. WHICH PERMITS COUNT AS YOURS
#
#  This is the part worth arguing with. It is your sales judgment,
#  written down as words and a dollar figure.
#
#  Tuned to Norfolk's vocabulary. Norfolk does not write free-text
#  descriptions, it uses fixed category labels like "Alteration/Repair
#  - Renovate Existing Square Footage" and "Addition - Increase Square
#  Footage". Two consequences:
#    - "repair" must NOT be in unwanted_work, because Norfolk's
#      renovation category contains that word and unwanted always wins.
#      "replace" and "reroof" still catch the actual junk.
#    - wanted_work needs Norfolk's own labels ("renovate",
#      "alteration") since words like "kitchen" or "pool" never appear.
# =====================================================================

# The money line: a permit must declare at least this much work.
minimum_job_value: 7000

# Some areas leave the dollar column blank on every permit. Norfolk
# fills it on about 85 percent of permits, so leave this false.
keep_permits_without_value: true

# The work you want. A permit has to mention one of these to survive.
wanted_work:
  - "new construction"
  - "new single family"
  - "addition"
  - "renovation"
  - "remodel"
  - "pool"
  - "deck"
  - "patio"
  - "porch"
  - "sunroom"
  - "outdoor kitchen"
  - "kitchen"
  - "bathroom"
  - "master suite"
  - "basement"
  - "media room"
  - "theater"
  - "wine cellar"
  - "elevator"
  - "detached garage"
  - "guest house"

# The work you never want. Checked FIRST, and it always wins. This is
# how "replace all deck boards" stops pretending to be a deck job.
# Note "repair" is deliberately absent: see the block comment above.
unwanted_work:
  - "commercial"
  - "industrial"
  - "tenant"
  - "multi-family"
  - "multifamily"
  - "apartment"
  - "mixed use"
  - "mixed-use"
  - "lot grading"
  - "land disturbance"
  - "sitework"
  - "cell tower"
  - "repair"
  - "replace"
  - "reroof"
  - "re-roof"
  - "roofing"
  - "shingle"
  - "siding"
  - "water heater"
  - "waterproof"
  - "foundation"
  - "insulation"
  - "mold"
  - "remediation"
  - "demolition"
  - "gutter"
  - "storage shed"

# Permits pulled by an LLC are usually a builder or a landlord, not a
# homeowner you can sell to. Set to false if you sell to builders.
skip_company_owners: true


# =====================================================================
#  6. THE POSTCARD
#
#  Nothing is mailed. The run produces front and back images plus a
#  PDF that you download from the Actions page and look at.
# =====================================================================
postcard:
  # Printed size in inches. 6x4 is a standard postcard; 6x9 and 6x11
  # are the common oversized mailers.
  size: "6x4"

  # Your accent colour, as a hex code. Used for the banner and rules.
  accent_color: "#1F4E79"

  # How many of the top-scoring permits to render. One card per permit.
  render_top: 1
